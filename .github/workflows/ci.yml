name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Корінний tsconfig.json — solution-style ("files": [] + "references"),
      # тож голий `tsc --noEmit` перевіряє нуль файлів і завжди виходить з 0,
      # мовчки пропускаючи будь-які помилки в tsconfig.app.json/tsconfig.node.json.
      # `-b` (build mode) реально збирає обидва referenced-проєкти.
      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
